<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Online JSON Formatter - DevKit</title><meta name="description" content="JSON 美化工具 - 格式化/压缩/验证 JSON"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh}header{background:#161b22;border-bottom:1px solid #30363d;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:18px;font-weight:700;color:#58a6ff}.logo span{color:#f0c040}main{max-width:700px;margin:32px auto;padding:0 24px;flex:1}footer{padding:16px 24px;border-top:1px solid #21262d;text-align:center;font-size:12px;color:#484f58}footer a{color:#58a6ff;text-decoration:none;margin:0 8px}.ta{width:100%;padding:16px;font-size:13px;border:1px solid #30363d;border-radius:8px;background:#0d1117;color:#c9d1d9;resize:vertical;outline:none;font-family:mono;line-height:1.6}.ta:focus{border-color:#58a6ff}.btn{padding:10px 24px;font-size:13px;font-weight:600;border:1px solid #30363d;border-radius:8px;cursor:pointer;background:#21262d;color:#c9d1d9}.btn:hover{background:#30363d}.btn-p{background:#238636;border-color:#238636;color:#fff}.btn-p:hover{background:#2ea043}.actions{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap;align-items:center}.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:16px;margin:12px 0}</style></head><body><header><div class="logo">🛠 <span>Dev</span>Kit</div><div style="font-size:11px;color:#8b949e">🔒 本地处理 · 数据不上传</div></header><main><h1 style="font-size:24px;margin-bottom:4px">Online JSON Formatter</h1><p style="color:#8b949e;font-size:14px;margin-bottom:16px">JSON 美化工具 - 格式化/压缩/验证 JSON</p><div class="tool-wrapper"><div class="actions"><button class="btn btn-p" onclick="fmt()">✨ 格式化</button><button class="btn" onclick="min()">📦 压缩</button><button class="btn" onclick="copy()">📋 复制</button></div><textarea id="jf-input" class="ta" placeholder='{"hello":"world"}' rows="6"></textarea><textarea id="jf-output" class="ta" readonly rows="8" style="background:#161b22;min-height:200px;margin-top:12px"></textarea></div></main><footer><a href="https://github.com/479464887-rgb/json-formatter">GitHub</a><span>·</span><span>© 2026 DevKit</span></footer><script>function fmt(){try{const o=JSON.parse(document.getElementById('jf-input').value.trim());document.getElementById('jf-output').value=JSON.stringify(o,null,2)}catch(e){document.getElementById('jf-output').value='❌ '+e.message}}function min(){try{const o=JSON.parse(document.getElementById('jf-input').value.trim());document.getElementById('jf-output').value=JSON.stringify(o)}catch(e){document.getElementById('jf-output').value='❌ '+e.message}}function copy(){navigator.clipboard.writeText(document.getElementById('jf-output').value)}</script></body></html>
